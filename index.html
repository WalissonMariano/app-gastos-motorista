<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#10253D" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="Controle de receitas e despesas do motorista"
    />
    <title>Gastos do Motorista</title>
    <link rel="icon" href="/assets/logo.png" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app" id="app">
      <section class="login" id="loginScreen">
        <div class="login__brand">
          <img
            class="login__logo"
            src="/assets/logo.png"
            alt="Gastos do Motorista"
            width="220"
            height="220"
          />
          <p>Entre para registrar seu caixa</p>
        </div>
        <form class="form login__form" id="loginForm">
          <label class="field">
            <span>Usuário</span>
            <input name="username" autocomplete="username" placeholder="motorista" required />
          </label>
          <label class="field">
            <span>Senha</span>
            <input name="password" type="password" autocomplete="current-password" placeholder="••••" required />
          </label>
          <p class="login__error" id="loginError" hidden></p>
          <button class="btn primary full" type="submit">Entrar</button>
        </form>
        <p class="login__hint">Acesso: motorista / 1234</p>
      </section>

      <div id="workspace" hidden>
        <header class="topbar">
          <div class="topbar__brand">
            <img class="topbar__logo" src="/assets/logo.png" alt="" width="40" height="40" />
            <div>
              <p class="eyebrow" id="headerEyebrow">Gastos do Motorista</p>
              <h1 id="headerTitle">Início</h1>
            </div>
          </div>
          <div class="topbar__actions">
            <button class="icon-btn" id="periodBtn" type="button" aria-label="Filtrar período">
              <span id="periodLabel">Mês</span>
            </button>
            <button class="icon-btn" id="logoutBtn" type="button">Sair</button>
          </div>
        </header>

        <main class="content" id="content"></main>

        <nav class="tabbar" aria-label="Navegação principal">
          <button class="tab is-active" data-view="home" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg>
            Início
          </button>
          <button class="tab" data-view="lancamentos" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12a1 1 0 0 1 1 1v15l-7-3-7 3V5a1 1 0 0 1 1-1zm2 4h8M8 12h8"/></svg>
            Lançamentos
          </button>
          <button class="fab" id="addBtn" type="button" aria-label="Novo lançamento">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <button class="tab" data-view="relatorio" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V9h3v10zm6 0V5h3v14zm6 0v-7h3v7z"/></svg>
            Relatório
          </button>
        </nav>
      </div>
    </div>

    <div class="sheet" id="sheet" hidden>
      <button class="sheet__backdrop" id="sheetBackdrop" type="button" aria-label="Fechar"></button>
      <section class="sheet__panel" id="sheetPanel" role="dialog" aria-modal="true"></section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="js/app.js"></script>
  </body>
</html>
